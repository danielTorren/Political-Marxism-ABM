[project]
name = "pmabm"
version = "0.1.0"
description = "Agent-based model of Brenner's theory of the transition from feudalism to capitalism"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0.3",
    "salib>=1.5",
    "pyarrow>=15",
]

[project.optional-dependencies]
# The neural-network emulator (src/emulator). Optional because torch is a ~200 MB dependency
# that nothing else in the project needs: install with `uv sync --extra emulator`.
emulator = [
    "torch>=2.2",
    "scikit-learn>=1.4",   # ridge and random-forest baselines the network is reported against
]

[project.scripts]
pmabm = "pmabm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmabm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# CPU-only torch. The default PyPI wheel drags in ~3 GB of CUDA runtime that this project has no
# use for: the emulator is a few-hundred-thousand-parameter MLP fitted on a few thousand rows,
# which trains in minutes on the CPU that runs the ABM.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
